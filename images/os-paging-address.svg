<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#185FA5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#1a1a1a">分页存储地址转换</text>
  <text x="380" y="52" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#5F5E5A">页面大小 4KB = 2¹²，页内偏移占 12 位（十六进制 3 位）</text>

  <rect x="55" y="82" width="260" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
  <text x="185" y="104" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0C447C">逻辑地址 1D16H（16 进制）</text>

  <path d="M185 130 L185 152" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="55" y="154" width="120" height="46" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
  <text x="115" y="174" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#26215C">页号（高位）</text>
  <text x="115" y="191" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#26215C">1</text>

  <rect x="195" y="154" width="120" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
  <text x="255" y="174" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#04342C">页内偏移（低 3 位）</text>
  <text x="255" y="191" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#04342C">D16H</text>

  <path d="M115 202 L115 248" fill="none" stroke="#534AB7" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="68" y="232" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#534AB7">查页表</text>

  <rect x="45" y="250" width="140" height="82" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.4"/>
  <text x="115" y="270" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#2C2C2A">页表</text>
  <line x1="55" y1="280" x2="175" y2="280" stroke="#B4B2A9" stroke-width="1"/>
  <text x="80" y="299" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#444441">页号 0 → 块 2</text>
  <text x="80" y="318" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#444441">页号 1 → 块 3</text>

  <path d="M185 288 L310 288" fill="none" stroke="#185FA5" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="247" y="280" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#185FA5">物理块号 3</text>

  <rect x="312" y="262" width="140" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
  <text x="382" y="283" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#633806">物理块号</text>
  <text x="382" y="302" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#633806">3</text>

  <path d="M382 262 L382 200" fill="none" stroke="#854F0B" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M255 202 L255 200" fill="none" stroke="#0F6E56" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="470" y="154" width="235" height="160" rx="10" fill="#F7F7F5" stroke="#888780" stroke-width="1.4"/>
  <text x="588" y="180" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">拼接物理地址</text>
  <text x="588" y="216" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#444441">物理块号 + 页内偏移</text>
  <rect x="505" y="238" width="80" height="40" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.3"/>
  <text x="545" y="263" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="15" fill="#633806">3</text>
  <rect x="591" y="238" width="80" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
  <text x="631" y="263" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="15" fill="#04342C">D16H</text>
  <text x="588" y="302" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="17" font-weight="600" fill="#1a1a1a">物理地址 = 3D16H</text>

  <text x="380" y="350" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#1a1a1a">页号与物理块号并非按顺序对应，必须查页表映射</text>
  <text x="380" y="378" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#5F5E5A">快表 = 页表存于 Cache；慢表 = 页表存于内存。快表只需一次 Cache + 一次内存访问</text>
  <text x="380" y="402" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#5F5E5A">段式区别：段表存段长和基址，段内偏移不得 ≥ 段长（越界判断）</text>
</svg>
