<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#1a1a1a">P / V 操作流程</text>

  <text x="190" y="66" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#0C447C">P 操作（申请资源）</text>
  <text x="565" y="66" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#085041">V 操作（释放资源）</text>

  <rect x="115" y="82" width="150" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
  <text x="190" y="106" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="15" fill="#0C447C">S = S − 1</text>

  <path d="M190 124 L190 148" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>

  <path d="M190 150 L115 190 L115 212" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M190 150 L265 190 L265 212" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="150" y="180" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#185FA5">S ≥ 0</text>
  <text x="232" y="180" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#A32D2D">S &lt; 0</text>

  <rect x="45" y="214" width="140" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
  <text x="115" y="242" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#085041">进程继续执行</text>

  <rect x="195" y="214" width="140" height="46" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.4"/>
  <text x="265" y="234" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#791F1F">置为阻塞状态</text>
  <text x="265" y="251" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#791F1F">插入阻塞队列</text>

  <rect x="490" y="82" width="150" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
  <text x="565" y="106" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="15" fill="#085041">S = S + 1</text>

  <path d="M565 124 L565 148" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>

  <path d="M565 150 L490 190 L490 212" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M565 150 L640 190 L640 212" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="525" y="180" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#0F6E56">S &gt; 0</text>
  <text x="607" y="180" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#A32D2D">S ≤ 0</text>

  <rect x="420" y="214" width="140" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
  <text x="490" y="242" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#085041">进程继续执行</text>

  <rect x="570" y="214" width="140" height="46" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
  <text x="640" y="234" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#633806">唤醒一个阻塞进程</text>
  <text x="640" y="251" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#633806">插入就绪队列</text>

  <line x1="380" y1="60" x2="380" y2="330" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="45" y1="285" x2="715" y2="285" stroke="#D3D1C7" stroke-width="1"/>

  <text x="380" y="312" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#1a1a1a">互斥信号量初值为 1，同步信号量初值一般为共享资源数量</text>
  <text x="380" y="338" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#1a1a1a">S 的绝对值表示等待队列中的进程数（S &lt; 0 时）</text>
  <text x="380" y="365" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#5F5E5A">生产者-消费者：S0 互斥（初值 1）、S1 空闲位（初值 n）、S2 商品数（初值 0）</text>
</svg>
